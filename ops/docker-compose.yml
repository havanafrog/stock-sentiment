# 재는 쪽 한 통.
#
#   docker compose -f ops/docker-compose.yml run --rm --name ops-wail verifier
#
# 붙으면 Claude 가 뜬다. 거기서 /ops verify 를 치면 된다.
#
# --name 이 통 이름이다. 안 주면 compose 가 ops-verifier-run-<해시> 로 짓는다 —
# Docker Desktop 에서 어느 통이 무엇을 재는지 알아볼 수 없다. 재는 대상 이름을
# 그대로 주면 된다. 도커는 [a-zA-Z0-9][a-zA-Z0-9_.-] 만 받는다 — 한글은 거부한다.
#
# 마운트가 규칙을 대신한다. 스킬에 "재는 쪽은 고치지 않는다" 고 적어 놨지만
# 그건 부탁이다. 저장소를 읽기 전용으로 걸면 부탁이 아니라 사실이 된다:
#
#   /repo      읽기 전용   — 고칠 수 없다. 커밋도 푸시도 못 한다. (실측 확인)
#   /ops       쓰기 가능   — 장부만 열어 준다
#   /scratch   쓰기 가능   — 서버를 띄워 보거나 복사해 부러뜨릴 자리
#   /tmp       메모리      — 나가면 사라진다
#
# 장부를 /repo/ops 에 겹쳐 걸어도 되지만 그러지 않는다. 읽기 전용 위에 마운트를
# 겹치면 그 폴더가 원본에 없을 때 통이 아예 안 뜬다. 따로 거는 게 안 깨진다.

services:
  verifier:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name 은 일부러 안 박는다. 박으면 이름이 하나로 고정돼 두 번째
    # 세션이 "name is already in use" 로 안 뜬다. ops 마다 통을 하나씩 올리는 게
    # 이 통의 쓰임이라 --name 으로 그때그때 짓는다.
    init: true                       # Ctrl+C 가 제대로 먹게
    stdin_open: true
    tty: true
    working_dir: /repo
    # 리눅스에서는 이게 있어야 장부에 쓸 수 있다. 통 안의 node 는 1000 인데
    # 호스트 사용자가 1001 이면 "Permission denied" 가 난다 — 실제로 겪었다.
    # 윈도우 Docker Desktop 에서는 상관없다. .env 에서 맞춰 준다.
    user: "${OPS_UID:-1000}:${OPS_GID:-1000}"
    environment:
      OPS_LEDGER: /ops/ledger.jsonl
      OPS_SCRATCH: /scratch
      # 저장소가 읽기 전용이라 진짜 글은 읽기만 된다. 서버를 띄워 봐야 하면
      # /scratch 로 복사해서 STOCK_DATA_DIR 을 거기로 돌려 쓴다.
      STOCK_DATA_DIR: /repo/data
      HOME: /home/node
    volumes:
      # 저장소 전체를 읽기 전용으로. 이게 이 통의 존재 이유다.
      - ..:/repo:ro
      # 장부. 호스트의 ops/ 를 그대로 본다 — 만드는 쪽과 같은 파일이다.
      - ./:/ops:rw
      # 자격증명. 없으면 통 안의 Claude 가 로그인을 못 한다.
      # 이 폴더에는 다른 프로젝트의 기록도 들어 있다 — 통에 그걸 다 보여 주는 셈이다.
      - ${CLAUDE_HOME}/.claude:/home/node/.claude:rw
      - ${CLAUDE_HOME}/.claude.json:/home/node/.claude.json:rw
      # 부러뜨려 볼 자리. 나가면 사라진다.
      - ops-scratch:/scratch
    tmpfs:
      - /tmp

  # 판 — agentsemble board. Docker Desktop 에서 ▶ 로 켜고 끈다.
  #
  #   docker compose -f ops/docker-compose.yml up -d board
  #   http://127.0.0.1:8740
  #
  # 판 코드는 이 PC 에 깔린 agentsemble 플러그인 중 가장 새 버전을 켤 때마다 고른다.
  # 전부 읽기 전용으로 건다 — 판은 아무것도 안 고친다.
  board:
    # 작업칸 .git 이 상대 경로(relativeworktrees)라 git 2.48 이상이 있어야 한다. 데비안 git 은 낡았다.
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-alpine
        RUN apk add --no-cache git
    image: agentsemble-board
    container_name: agentsemble-board
    init: true
    # 일부러 안 되살린다. unless-stopped 로 두면 Docker Desktop 이 켜질 때마다
    # 판이 따라 뜨고, 그만큼 WSL2 하이퍼바이저가 늘 돈다. 이 기계에서는
    # Riot Vanguard(vgk.sys)와 그 조합이 파란화면을 냈다(2026-08-30, 두 번).
    restart: "no"
    working_dir: /work/stock-sentiment
    entrypoint: ["sh", "-c", "exec node \"$$(ls -d /agentsemble/*/ | sort -V | tail -1)bin/board.mjs\" --host 0.0.0.0"]
    environment:
      CLAUDE_HOME: /claude
      # 통 안 /work 가 호스트의 어디인지. 세션 기록 폴더 이름이 호스트 경로로 지어져 있다.
      AGENTSEMBLE_PATH_MAP: /work=${HOST_WORK_DIR}
      # 저장소는 읽기 전용이고 주인이 달라서 git 이 거부한다. 읽기만 하니 풀어 둔다.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GIT_OPTIONAL_LOCKS: "0"
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에만 건다. 판에는 대화가 통째로 나온다.
      - "127.0.0.1:8740:8740"
    volumes:
      # 저장소와 작업칸(stock-sentiment-auto · -train)이 든 윗폴더. 작업칸의 .git 이
      # 상대 경로라(git worktree repair --relative-paths) 통 안에서도 이어진다.
      - ../..:/work:ro
      - ${CLAUDE_HOME}/.claude/plugins/cache/agentsemble/agentsemble:/agentsemble:ro
      - ${CLAUDE_HOME}/.claude/sessions:/claude/sessions:ro
      # 세션 기록은 이 저장소 것만 — projects 전체를 걸면 다른 프로젝트 대화까지 보인다.
      - ${OPS_LOG_DIR_HOST}:/claude/projects/${OPS_LOG_SLUG}:ro
      - ${OPS_LOG_DIR_HOST}-auto:/claude/projects/${OPS_LOG_SLUG}-auto:ro
      - ${OPS_LOG_DIR_HOST}-train:/claude/projects/${OPS_LOG_SLUG}-train:ro

volumes:
  ops-scratch:
