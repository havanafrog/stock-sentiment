<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ops</title>
<style>
  :root {
    --page: #f4f5f8; --surface: #fbfcfd;
    --text: #191f28; --sub: #4e5968; --faint: #8b95a1;
    --hair: #e5e8eb; --ring: inset 0 0 0 1px rgba(2,32,71,.05);
    --live: #f04452; --calm: #3182f6; --warn: #f5a623;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #17171c; --surface: #1f2027;
      --text: #e9ecef; --sub: #adb5bd; --faint: #6b7280;
      --hair: #2b2d36; --ring: inset 0 0 0 1px rgba(255,255,255,.06);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 20px 16px 40px; }

  .bar { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 12px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .tally { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--text); font-weight: 650; }
  .tally .hot { color: var(--live); }
  .tally .cool { color: var(--warn); }

  .card { background: var(--surface); box-shadow: var(--ring); border-radius: 14px;
          padding: 14px 16px; overflow-x: auto; }
  #map { width: 100%; min-width: 720px; height: auto; display: block; }

  .nb { fill: var(--page); stroke: var(--hair); stroke-width: 1; }
  .nb.on   { stroke: var(--calm); stroke-width: 1.5; }
  .nb.warn { stroke: var(--warn); stroke-width: 1.5; }
  .nb.bad  { stroke: var(--live); stroke-width: 1.5; }
  .nb.live { stroke: var(--live); stroke-width: 1.8; }
  .nt { font-size: 12px; font-weight: 650; fill: var(--text); }
  .ns { font-size: 10.5px; fill: var(--faint); }
  .ns.on { fill: var(--calm); } .ns.warn { fill: var(--warn); }
  .ns.bad, .ns.live { fill: var(--live); }
  .pulse { fill: var(--live); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
  .ed { stroke: var(--hair); stroke-width: 1.4; fill: none; marker-end: url(#tip); }
  .ed.soft { stroke-dasharray: 3 3; }
  .lane { font-size: 10.5px; fill: var(--faint); font-weight: 600; }
</style>

<div class="wrap">
  <div class="bar">
    <h1>ops</h1>
    <span class="tally" id="tally">불러오는 중…</span>
  </div>
  <div class="card"><svg id="map" role="img" aria-label="노드 상태"></svg></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const cut = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const num = n => (n ?? 0).toLocaleString();
const mb = b => (b >= 1e6 ? (b / 1e6).toFixed(1) + 'MB' : Math.round(b / 1e3) + 'KB');

// 몇 초 · 몇 분 · 몇 시간. 그 위로는 날짜를 세도 못 읽는다.
function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 5) return '방금';
  if (s < 60) return s + '초 전';
  const m = Math.round(s / 60);
  if (m < 60) return m + '분 전';
  const h = Math.round(m / 60);
  return h < 24 ? h + '시간 전' : Math.round(h / 24) + '일 전';
}

// ── 자리 ─────────────────────────────────────────────────────
// 줄 넷. 위 셋은 늘 같은 자리에 서고, 넷째 줄만 세션 수에 따라 늘어난다.
// 좌표는 여기 한 곳에만 적는다 — 마크업과 갈리면 둘 다 못 믿는다.
const W = 132, H = 46, GAP = 26, ROW = 96, PER = 6;
const COL = i => 14 + i * (W + GAP);

const FIXED = [
  { id: 'toss',   c: 0, r: 0, t: '토스 API' },
  { id: 'fetch',  c: 1, r: 0, t: '글 수집' },
  { id: 'posts',  c: 2, r: 0, t: 'posts.json' },
  { id: 'build',  c: 3, r: 0, t: 'build.mjs' },
  { id: 'server', c: 4, r: 0, t: 'server.mjs' },
  { id: 'live',   c: 5, r: 0, t: 'live.html' },

  { id: 'slm',    c: 0, r: 1, t: 'SLM 라벨' },
  { id: 'train',  c: 1, r: 1, t: 'train-nb' },
  { id: 'model',  c: 2, r: 1, t: 'model.json' },
  { id: 'lex',    c: 3, r: 1, t: 'lexicon.js' },
  { id: 'ruler',  c: 4, r: 1, t: '사람 자' },

  { id: 'ledger', c: 2, r: 2, t: '장부' },
  { id: 'checker',c: 4, r: 2, t: '재는 쪽' },
  { id: 'board',  c: 5, r: 2, t: '판' },
];

const LANES = ['글이 흐르는 길', '채점기를 만드는 길', 'ops', '세션'];

let AT = {};
function place(sessions) {
  AT = {};
  for (const n of FIXED) AT[n.id] = { ...n, x: COL(n.c), y: 26 + n.r * ROW };
  sessions.forEach((s, i) => {
    AT['s' + i] = { id: 's' + i, t: cut(s.name || s.id.slice(0, 8), 9),
      x: COL(i % PER), y: 26 + (3 + Math.floor(i / PER)) * ROW };
  });
}

/** 마주 보는 면끼리 잇는다. 뒤로 가는 선도 화살촉이 제 방향을 보게. */
function edge(a, b, soft) {
  const p = AT[a], q = AT[b];
  if (!p || !q) return '';
  const fwd = q.x >= p.x;
  const x1 = fwd ? p.x + W : p.x, x2 = fwd ? q.x : q.x + W;
  const y1 = p.y + H / 2, y2 = q.y + H / 2, gap = fwd ? -6 : 6;
  const cls = 'ed' + (soft ? ' soft' : '');
  if (y1 === y2) return `<path class="${cls}" d="M${x1} ${y1}H${x2 + gap}"/>`;
  const mx = (x1 + x2) / 2;
  return `<path class="${cls}" d="M${x1} ${y1}H${mx}V${y2}H${x2 + gap}"/>`;
}
/** 아래 줄에서 위로 올려 붙인다. */
function up(a, b, soft) {
  const p = AT[a], q = AT[b];
  if (!p || !q) return '';
  const x1 = p.x + W / 2, y1 = p.y, x2 = q.x + W / 2, y2 = q.y + H;
  return `<path class="ed${soft ? ' soft' : ''}" d="M${x1} ${y1}V${(y1 + y2) / 2}H${x2}V${y2 + 6}"/>`;
}
/** 사이에 낀 칸을 밟지 않게 아래로 돌아간다. */
function dip(a, b, drop = 32) {
  const p = AT[a], q = AT[b];
  if (!p || !q) return '';
  const x1 = p.x + W / 2, y1 = p.y + H, x2 = q.x + W / 2, y2 = q.y + H;
  const my = Math.max(y1, y2) + drop;
  return `<path class="ed soft" d="M${x1} ${y1}V${my}H${x2}V${y2 + 6}"/>`;
}

function box(n, sub, cls, live) {
  const dot = live ? `<circle class="pulse" cx="${n.x + W - 14}" cy="${n.y + 15}" r="3.5"/>` : '';
  return `<g><rect class="nb ${cls}" x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="9"/>`
    + `<text class="nt" x="${n.x + 11}" y="${n.y + 19}">${esc(n.t)}</text>`
    + `<text class="ns ${cls}" x="${n.x + 11}" y="${n.y + 35}">${esc(sub)}</text>${dot}</g>`;
}

function draw(d) {
  const now = Date.now();
  const { corpus: c, model: m, service: s, sessions } = d;
  place(sessions);

  const newest = Math.max(0, ...c.rows.map(r => r.at ?? 0));
  const bytes = c.rows.reduce((a, r) => a + r.bytes, 0);
  const svc = s.rows?.[0];
  const stuck = d.open.some(x => x.stuck);

  // [부제, 상태]. 상태가 곧 테두리 색이다.
  const S = {
    toss:   ['댓글 · 시세', ''],
    fetch:  [newest ? ago(now - newest) : '기록 없음',
             !newest ? 'bad' : now - newest > 2 * 864e5 ? 'warn' : ''],
    posts:  [`${c.rows.length}종목 · ${mb(bytes)}`, ''],
    build:  [c.builtAt ? `기준선 ${ago(now - c.builtAt)}` : '기준선 없음', c.builtAt ? '' : 'bad'],
    server: [svc ? svc.status : s.off ? '안 봄' : '물어보는 중', svc?.healthy ? 'on' : ''],
    live:   ['곡소리 지수', ''],
    slm:    [`${num(m.labels.slm)}건`, ''],
    train:  ['글자 n-gram', ''],
    model:  [`어휘 ${num(m.vocab)}`, m.vocab ? '' : 'bad'],
    lex:    ['공포어 사전', ''],
    ruler:  [m.measured ? `분류기 ${m.measured['분류기']}%` : '안 쟀음',
             m.measured ? 'on' : 'warn'],
    ledger: [`열림 ${d.open.length} · 닫힘 ${d.counts.closed}`, stuck ? 'bad' : ''],
    checker:['읽기 전용 통', ''],
    board:  ['127.0.0.1:8730', 'on'],
  };

  const rows = 3 + Math.max(1, Math.ceil(sessions.length / PER));
  $('map').setAttribute('viewBox', `0 0 ${14 + PER * (W + GAP)} ${26 + rows * ROW + 6}`);

  const edges = [
    ['toss','fetch'], ['fetch','posts'], ['posts','build'], ['build','server'], ['server','live'],
    ['slm','train'], ['train','model'],
  ].map(([a, b]) => edge(a, b)).join('')
    + edge('ruler', 'model', true)
    + edge('checker', 'ledger')
    + dip('ledger', 'board')
    + up('model', 'server', true) + up('lex', 'build', true)
    // 세션은 장부에 주장을 넣는 쪽이다. 일하는 창만 잇는다 — 다 이으면 선이 숲이 된다.
    + sessions.map((x, i) => (x.moving ? up('s' + i, 'ledger', true) : '')).join('');

  const lanes = LANES.map((t, i) =>
    `<text class="lane" x="14" y="${26 + i * ROW - 9}">${esc(t)}</text>`).join('');

  const fixed = FIXED.map(n => box(AT[n.id], S[n.id][0], S[n.id][1])).join('');
  const sess = sessions.length
    ? sessions.map((x, i) => box(AT['s' + i],
        x.last?.kind === 'tool' ? cut(x.last.tool.replace(/^mcp__[a-z-]+__/, ''), 13) : ago(x.idleMs),
        x.moving ? 'live' : '', x.moving)).join('')
    : `<text class="ns" x="14" y="${26 + 3 * ROW + 28}">도는 세션이 없습니다</text>`;

  $('map').innerHTML = '<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4"'
    + ' markerWidth="7" markerHeight="7" orient="auto">'
    + '<path d="M0 0L8 4L0 8z" fill="var(--hair)"/></marker></defs>'
    + lanes + edges + fixed + sess;

  const vals = Object.values(S);
  const bad = vals.filter(v => v[1] === 'bad').length;
  const warn = vals.filter(v => v[1] === 'warn').length;
  const live = sessions.filter(x => x.moving).length;
  $('tally').innerHTML = `노드 <b>${FIXED.length + sessions.length}</b>`
    + (bad ? ` · <span class="hot">막힘 ${bad}</span>` : '')
    + (warn ? ` · <span class="cool">주의 ${warn}</span>` : '')
    + (bad || warn ? '' : ' · 모두 정상')
    + ` · 일하는 중 ${live}`;
}

let stale = 0;
async function tick() {
  try {
    draw(await (await fetch('/api/board')).json());
    stale = 0;
  } catch {
    // 서버가 잠깐 없어도 화면은 남긴다. 계속 못 받으면 그때 말한다.
    if (++stale > 3) $('tally').textContent = '서버가 안 보입니다';
  }
}
tick();
setInterval(tick, 2000);
</script>
