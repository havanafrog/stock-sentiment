<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ops</title>
<style>
  :root {
    --page: #f4f5f8; --surface: #fbfcfd;
    --text: #191f28; --sub: #4e5968; --faint: #8b95a1;
    --hair: #e5e8eb; --ring: inset 0 0 0 1px rgba(2,32,71,.05);
    --live: #f04452; --calm: #3182f6; --warn: #f5a623; --good: #15c26b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #17171c; --surface: #1f2027;
      --text: #e9ecef; --sub: #adb5bd; --faint: #6b7280;
      --hair: #2b2d36; --ring: inset 0 0 0 1px rgba(255,255,255,.06);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }

  .bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 2px 14px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .tally { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--text); font-weight: 650; }
  .tally .hot { color: var(--live); }
  .tally .cool { color: var(--warn); }
  .repo { margin-left: auto; font-size: 12px; color: var(--faint);
          font-variant-numeric: tabular-nums; }

  /* 탭 — 창과 장부를 가른다. 넘길 것 알림은 탭 위에 있어서 어느 탭에서도 보인다. */
  .tabs { display: flex; gap: 4px; margin: 0 0 14px; border-bottom: 1px solid var(--hair); }
  .tab { appearance: none; background: none; border: 0; cursor: pointer;
         font: inherit; font-size: 13px; font-weight: 650; color: var(--faint);
         padding: 8px 14px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--sub); }
  .tab.on { color: var(--text); border-bottom-color: var(--calm); }
  .tab .n { font-weight: 500; font-variant-numeric: tabular-nums; opacity: .65; }
  .pane[hidden] { display: none; }

  /* 창 — 하나가 카드 하나. 눌러서 앞으로 가져오거나 되살린다. */
  .cards { display: grid; gap: 12px; align-items: start;
           grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); }
  .win { background: var(--surface); box-shadow: var(--ring); border-radius: 16px;
         padding: 16px 18px 14px; display: grid; gap: 10px; }
  /* 카드를 누르면 그 세션 대화가 서랍에 뜬다. 창을 앞으로 가져오는 건 구석 단추. */
  .win { cursor: pointer; }
  .win:hover { box-shadow: inset 0 0 0 1.5px var(--calm); }
  .win.live { box-shadow: inset 0 0 0 1.5px var(--live); }
  .win.live:hover { box-shadow: inset 0 0 0 2px var(--live); }
  .win.sel { box-shadow: inset 0 0 0 2px var(--calm); }
  .where { font-size: 11px; font-weight: 650; color: var(--calm); background: var(--page);
           border-radius: 6px; padding: 1px 7px; flex: none; }
  .go { appearance: none; border: 0; background: none; font: inherit; font-size: 11.5px;
        color: var(--sub); cursor: pointer; padding: 4px 6px; margin: -4px -6px -4px auto;
        border-radius: 6px; min-height: 24px; }
  .usd + .go { margin-left: 4px; }
  .go:hover { background: var(--page); color: var(--text); }
  /* 상하 — main 이 위, 서브가 아래. 줄기 하나가 내려와 가지로 갈라진다. */
  .brain { box-shadow: inset 0 0 0 2px var(--text); }
  .brain.live { box-shadow: inset 0 0 0 2px var(--live); }
  .role { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; flex: none;
          color: var(--surface); background: var(--text); border-radius: 5px; padding: 1px 6px; }
  .trunk { width: 2px; height: 18px; background: var(--faint); margin-left: 36px; }
  /* 가지 줄(윗선)이 서브 카드들 너비만큼만 뻗게 fit-content. 카드가 하나면 줄도 짧다. */
  .subs { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; position: relative;
          width: fit-content; max-width: calc(100% - 36px);
          border-top: 2px solid var(--faint); padding-top: 18px; margin: 0 0 22px 36px; }
  .sub { position: relative; width: 380px; max-width: 100%; }
  .sub::before { content: ''; position: absolute; top: -18px; left: 0; width: 2px;
                 height: 18px; background: var(--faint); }
  .sub .win { border-top-left-radius: 4px; }
  .order { font-size: 11.5px; color: var(--sub); margin: 0 0 6px 10px; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .order b { color: var(--text); font-weight: 650; }
  .loopcard { cursor: pointer; }
  .apart { font-size: 12px; font-weight: 650; color: var(--sub); margin: 4px 2px 10px; }
  .oldbox { margin-top: 14px; }
  .oldbox > summary { font-size: 12px; color: var(--sub); cursor: pointer; padding: 6px 2px; }
  .oldbox .cards { margin-top: 8px; opacity: .8; }

  /* 서랍 — 한 세션의 대화. 카드 목록 위에 오른쪽으로 겹친다. 폰에서는 화면 전체. */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw);
            background: var(--surface); box-shadow: -8px 0 32px rgba(0,0,0,.14);
            display: flex; flex-direction: column; z-index: 10; }
  .drawer[hidden] { display: none; }
  .dh { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px;
        border-bottom: 1px solid var(--hair); }
  .dh .wn { font-size: 16px; }
  .dh .ws { margin-left: 0; }
  .x { appearance: none; border: 0; background: none; font: inherit; font-size: 18px;
       color: var(--sub); cursor: pointer; margin-left: auto; width: 32px; height: 32px;
       border-radius: 8px; flex: none; }
  .x:hover { background: var(--page); color: var(--text); }
  .db { flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: flex;
        flex-direction: column; gap: 8px; overscroll-behavior: contain; }
  .more { align-self: center; appearance: none; border: 0; background: var(--page);
          color: var(--sub); font: inherit; font-size: 12px; padding: 6px 14px;
          border-radius: 999px; cursor: pointer; }
  .bub { max-width: 86%; padding: 9px 13px; border-radius: 14px; font-size: 13px;
         line-height: 1.55; word-break: break-word; }
  /* 흰 글자에 --calm(#3182f6) 이면 대비 3.71 이라 AA 미달. 같은 색조를 내려 5.12. */
  .bub.me { align-self: flex-end; background: #0a66ea; color: #fff;
            border-bottom-right-radius: 4px; }
  .bub.claude { align-self: flex-start; background: var(--page); color: var(--text);
                border-bottom-left-radius: 4px; }
  .bub.in { align-self: flex-start; background: none; color: var(--text);
            box-shadow: inset 0 0 0 1.5px var(--warn); }
  .bub .t { display: block; font-size: 10.5px; opacity: .7; margin-bottom: 2px; }
  .tools { align-self: flex-start; font-size: 11.5px; color: var(--sub); max-width: 92%; }
  .tools > summary { cursor: pointer; padding: 2px 4px; list-style: none; }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::before { content: '▸ '; }
  .tools[open] > summary::before { content: '▾ '; }
  .tools ol { margin: 4px 0 2px; padding-left: 22px; display: grid; gap: 2px; }
  .tools li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools b { font-weight: 650; color: var(--calm); margin-right: 6px; }
  .day { align-self: center; font-size: 10.5px; color: var(--sub); padding: 4px 0; }

  .wt { display: flex; align-items: baseline; gap: 10px; }
  /* min-width:0 이 없으면 flex 안에서 줄임표가 안 먹고 이름이 카드를 뚫고 나간다. */
  .wn { font-weight: 700; font-size: 19px; letter-spacing: -.02em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ws { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap;
        font-variant-numeric: tabular-nums; flex: none; }
  .ws.on { color: var(--live); }
  /* 사람 차례다. 눈에 걸려야 하는 칸은 이것 하나뿐이다. */
  .ws.waiting { color: var(--calm); }
  .ws.stopped { opacity: .55; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live);
         display: inline-block; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none } }

  .say { font-size: 13.5px; color: var(--text); overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .say i { color: var(--faint); font-style: normal; font-size: 12px; margin-right: 6px; }
  .say.empty { color: var(--faint); font-size: 12.5px; }

  /* 흐름 — 최근 다섯 수를 시간순으로. 세 칸이라 눈이 세로로 흐른다. */
  .flow { display: grid; grid-template-columns: auto auto minmax(0, 1fr);
          gap: 2px 10px; align-items: baseline;
          border-top: 1px solid var(--hair); padding-top: 10px; }
  .fw { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums;
        white-space: nowrap; }
  .ft { font-size: 11.5px; font-weight: 650; color: var(--calm); white-space: nowrap; }
  .ft.talk { color: var(--faint); font-weight: 500; }
  .fx { font-size: 12px; color: var(--sub); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
  .flow .now .fw, .flow .now .fx { color: var(--text); }

  .foot { display: flex; gap: 10px; align-items: baseline; font-size: 11.5px;
          color: var(--faint); font-variant-numeric: tabular-nums; }
  .usd { margin-left: auto; font-weight: 650; color: var(--sub); }
  .none { color: var(--faint); font-size: 12.5px; padding: 2px 2px 0; }

  /* 열린 창 — 기록이 아니라 등록부다. 이 저장소 밖의 창도 여기서는 보인다. */
  .lv { display: grid; gap: 12px; align-items: baseline;
        grid-template-columns: 8px minmax(0, 1.1fr) minmax(0, 1fr) auto;
        padding: 9px 12px; border-bottom: 1px solid var(--hair); }
  .lv:last-child { border-bottom: 0; }
  .lv.pick { cursor: pointer; }
  .lv.pick:hover { background: var(--page); }
  .lv.old { opacity: .45; }
  .st { width: 8px; height: 8px; border-radius: 50%; background: var(--hair); }
  .st.busy { background: var(--live); }
  .st.idle { background: var(--good); }
  .ln { font-weight: 650; font-size: 13px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
  .ln.noname { font-weight: 500; color: var(--faint); }
  .ln .me { font-weight: 500; font-size: 11px; color: var(--calm); margin-left: 6px; }
  .lp { font-size: 12px; color: var(--sub); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
  .lm { font-size: 11px; color: var(--faint); white-space: nowrap;
        font-variant-numeric: tabular-nums; }

  /* 장부 */
  .card { background: var(--surface); box-shadow: var(--ring); border-radius: 14px;
          padding: 6px 4px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 7px 12px;
         border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: 0; }
  .rid { font-weight: 650; font-size: 12px; width: 34px; flex: none;
         font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; font-weight: 650; flex: none; width: 46px; }
  .tag.claim { color: var(--calm); }
  .tag.ok    { color: var(--good); }
  .tag.no    { color: var(--live); }
  .tag.hold  { color: var(--warn); }
  .tag.note  { color: var(--faint); }
  .what { font-size: 12.5px; color: var(--sub); overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .when { margin-left: auto; font-size: 11px; color: var(--faint); flex: none;
          font-variant-numeric: tabular-nums; }

  /* 자동 — 혼자 도는 판. 한 판이 줄 하나고, 눌러서 펴면 물음과 답 전문이 나온다.
     물음은 앞판의 답이라 길다. 접어 두지 않으면 한 판이 화면을 다 먹는다. */
  .lap { border-bottom: 1px solid var(--hair); }
  .lap:last-child { border-bottom: 0; }
  .lap > summary { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px;
                   cursor: pointer; list-style: none; }
  .lap > summary::-webkit-details-marker { display: none; }
  .lap > summary:hover { background: var(--page); }
  .lap .no { font-weight: 650; font-size: 12px; width: 34px; flex: none;
             font-variant-numeric: tabular-nums; }
  .lap .plan { font-size: 12.5px; color: var(--text); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .lap .plan.none { color: var(--faint); }
  .lap.stuck .no { color: var(--live); }
  .msg .no { width: auto; min-width: 96px; }
  .lap .use { margin-left: auto; font-size: 11px; color: var(--faint); flex: none;
              font-variant-numeric: tabular-nums; }
  .again { font-size: 10.5px; color: var(--faint); text-align: center;
           padding: 5px 12px; border-bottom: 1px solid var(--hair);
           background: var(--page); letter-spacing: .02em; }
  .lap .body { padding: 2px 12px 12px; display: grid; gap: 10px; }
  .lap .body h4 { margin: 0; font-size: 11px; font-weight: 650; color: var(--faint); }
  .lap .body .md { margin-top: 3px; font-size: 12.5px; color: var(--text); word-break: break-word; }

  /* 마크다운 — 대화에 섞인 **굵게**·목록·표·코드를 읽히게. 판 안에서 작게 그린다. */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 6px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 1.05em; font-weight: 700;
    margin: 10px 0 4px; color: inherit; }
  .md h1, .md h2 { font-size: 1.15em; }
  .md ul, .md ol { margin: 0 0 6px; padding-left: 20px; }
  .md li { margin: 1px 0; }
  .md code { font: 12px ui-monospace, Consolas, monospace; background: rgba(127,127,127,.16);
    padding: 1px 4px; border-radius: 4px; }
  .md pre { margin: 4px 0 8px; padding: 8px 10px; background: rgba(127,127,127,.12);
    border-radius: 8px; overflow-x: auto; white-space: pre; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 0 0 6px; padding: 2px 10px; border-left: 3px solid var(--hair);
    color: var(--sub); }
  .bub.me .md blockquote { color: inherit; border-left-color: rgba(255,255,255,.5); }
  .md hr { border: 0; border-top: 1px solid var(--hair); margin: 8px 0; }
  .md .tw { overflow-x: auto; margin: 4px 0 8px; }
  .md table { border-collapse: collapse; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--hair); padding: 3px 8px; text-align: left;
    vertical-align: top; }
  .md th { font-weight: 650; background: rgba(127,127,127,.08); }
  /* 긴 글은 앞만 보이고 '펼치기' 로 연다. 한 답이 서랍을 다 먹지 않게. */
  .fold { position: relative; max-height: 300px; overflow: hidden; }
  .fold::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: linear-gradient(transparent, var(--fold-bg, var(--surface))); pointer-events: none; }
  .bub.claude .fold { --fold-bg: var(--page); }
  .bub.me .fold { --fold-bg: #0a66ea; }
  .unfold { appearance: none; border: 0; background: none; font: inherit; font-size: 12px;
    font-weight: 650; color: var(--text); text-decoration: underline; cursor: pointer; padding: 4px 0 0; }
  .bub.me .unfold { color: #fff; }

  .warn-strip { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--warn);
                border-radius: 12px; padding: 9px 14px; margin-bottom: 12px;
                font-size: 12.5px; color: var(--text); }
</style>

<div class="wrap">
  <div class="bar">
    <h1>ops</h1>
    <span class="tally" id="tally">불러오는 중…</span>
    <span class="repo" id="repo"></span>
  </div>

  <!-- 넘길 것은 탭 위에 둔다. 장부 탭에 숨기면 보라고 만든 걸 못 본다. -->
  <div id="handoff"></div>

  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-pane="pane-wins">창 <span class="n" id="n-wins"></span></button>
    <button class="tab" role="tab" data-pane="pane-live">열린 창 <span class="n" id="n-live"></span></button>
    <button class="tab" role="tab" data-pane="pane-ledger">장부 <span class="n" id="n-ledger"></span></button>
    <button class="tab" role="tab" data-pane="pane-loop">자동 <span class="n" id="n-loop"></span></button>
    <button class="tab" role="tab" data-pane="pane-talk">지시 <span class="n" id="n-talk"></span></button>
  </div>

  <div class="pane" id="pane-wins"><div id="team"></div><div class="cards" id="wins"></div>
    <details class="oldbox" id="oldbox" hidden><summary>지난 창 <span id="n-old"></span></summary>
      <div class="cards" id="olds"></div></details></div>
  <div class="pane" id="pane-live" hidden><div class="card" id="live"></div></div>
  <div class="pane" id="pane-ledger" hidden><div class="card" id="ledger"></div></div>
  <div class="pane" id="pane-loop" hidden><div class="card" id="loop"></div></div>
  <div class="pane" id="pane-talk" hidden><div class="card" id="talk"></div></div>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dname" hidden>
  <div class="dh"><span class="wn" id="dname"></span><span class="ws" id="dphase"></span>
    <button class="x" id="dclose" aria-label="대화 닫기">✕</button></div>
  <div class="db" id="dbody"></div>
</aside>

<script>
const $ = id => document.getElementById(id);
// 따옴표까지 막는다 — 창 이름이 data-name 속성 안에 들어간다.
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const cut = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);

// ── 마크다운 ─────────────────────────────────────────────────
// 대화는 마크다운으로 오는데 원문 그대로 두면 ** 와 | 가 읽기를 막는다.
// 라이브러리 없이 판 안에서 그린다 — 판은 로컬 전용이라 망 없이도 돌아야 한다.
// 먼저 전부 이스케이프하고 나서 마크다운만 푼다. 대화 속 태그는 글자로 남는다.
// ponytail: 중첩 목록·각주·이미지는 안 푼다. 들여쓴 목록은 한 단으로 편다.
function inline(s) {
  // 코드 조각 안은 건드리지 않는다. 백틱으로 갈라 짝수 칸만 푼다.
  return s.split(/(`[^`]+`)/).map((p, i) => i % 2
    ? `<code>${p.slice(1, -1)}</code>`
    : p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<i>$2</i>')
       .replace(/\[([^\]]+)\]\((?:[^)\s]+)\)/g, '<u>$1</u>')).join('');
}
function md(src) {
  const L = esc(src ?? '').replace(/\r/g, '').split('\n');
  const out = [];
  let para = [];
  const flush = () => { if (para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; };
  const row = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (/^\s*```/.test(l)) {                               // 코드 블록
      flush();
      const body = [];
      while (++i < L.length && !/^\s*```/.test(L[i])) body.push(L[i]);
      out.push(`<pre><code>${body.join('\n')}</code></pre>`);
    } else if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:|-]+\|?\s*$/.test(L[i + 1] ?? '') && L[i + 1].includes('-')) {
      flush();                                             // 표: 머리줄 + |---| 줄
      const head = row(l);
      const body = [];
      i++;
      while (i + 1 < L.length && /^\s*\|/.test(L[i + 1])) body.push(row(L[++i]));
      out.push(`<div class="tw"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead>`
        + `<tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    } else if (/^\s*(#{1,6})\s+/.test(l)) {
      flush();
      const n = l.match(/^\s*(#{1,6})/)[1].length;
      out.push(`<h${n}>${inline(l.replace(/^\s*#{1,6}\s+/, ''))}</h${n}>`);
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) {
      flush(); out.push('<hr>');
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {        // 목록 — 이어진 줄을 한 묶음으로
      flush();
      const ol = /^\s*\d/.test(l);
      const items = [];
      const same = ol ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      for (; i < L.length && same.test(L[i]); i++) items.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
      i--;
      out.push(`<${ol ? 'ol' : 'ul'}>${items.map(t => `<li>${inline(t)}</li>`).join('')}</${ol ? 'ol' : 'ul'}>`);
    } else if (/^\s*&gt;\s?/.test(l)) {                   // 인용 (> 는 이미 &gt; 로 바뀌었다)
      flush();
      const q = [];
      for (; i < L.length && /^\s*&gt;\s?/.test(L[i]); i++) q.push(L[i].replace(/^\s*&gt;\s?/, ''));
      i--;
      out.push(`<blockquote>${q.map(inline).join('<br>')}</blockquote>`);
    } else if (!l.trim()) {
      flush();
    } else para.push(l);
  }
  flush();
  return out.join('');
}

// 긴 글은 접어 둔다. 편 것은 화면 밖에 기억한다 — 판이 다시 그려도 안 접히게.
const UNFOLD = new Set();
const LONG = t => (t ?? '').length > 1200 || (t ?? '').split('\n').length > 22;
function mdBox(text, key) {
  const long = LONG(text) && !UNFOLD.has(key);
  return `<div class="md${long ? ' fold' : ''}">${md(text)}</div>`
    + (long ? `<button class="unfold" data-k="${esc(key)}">펼치기</button>` : '');
}
addEventListener('click', e => {
  const b = e.target.closest?.('.unfold');
  if (!b) return;
  UNFOLD.add(b.dataset.k);
  b.previousElementSibling?.classList.remove('fold');
  b.remove();
});

// 토큰은 수천만까지 간다. 자릿수를 다 적으면 못 읽는다.
function short(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n ?? 0);
}
// 캐시 읽기가 압도적이라 따로 적는다. 셋을 합치면 무슨 일이 있었는지 안 보인다.
const toks = c => `입출력 ${short(c.in + c.out)} · 캐시 ${short(c.cacheRead + c.cacheWrite)}`;
const money = u => (u >= 100 ? '$' + Math.round(u) : '$' + u.toFixed(2));

// 몇 초 · 몇 분 · 몇 시간. 그 위로는 날짜를 세도 못 읽는다.
function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 5) return '방금';
  if (s < 60) return s + '초 전';
  const m = Math.round(s / 60);
  if (m < 60) return m + '분 전';
  const h = Math.round(m / 60);
  return h < 24 ? h + '시간 전' : Math.round(h / 24) + '일 전';
}

// ── 탭 ───────────────────────────────────────────────────────
// 고른 탭은 남긴다. 2초마다 다시 그리므로 안 남기면 갱신마다 창 탭으로 튄다.
const TABKEY = 'ops.tab';
function pick(id) {
  for (const b of document.querySelectorAll('.tab')) {
    const on = b.dataset.pane === id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
    $(b.dataset.pane).hidden = !on;
  }
  try { localStorage.setItem(TABKEY, id); } catch { /* 사생활 창이면 못 적는다 */ }
}
for (const b of document.querySelectorAll('.tab')) {
  b.addEventListener('click', () => pick(b.dataset.pane));
}
try {
  const saved = localStorage.getItem(TABKEY);
  if (saved && $(saved)) pick(saved);
} catch { /* 없으면 창 탭 그대로 */ }

// ── 창 ───────────────────────────────────────────────────────
// 창을 앞으로 가져오는 일은 판이 못 한다 — 판은 통 안에 있다. 브라우저는 호스트에
// 있으므로 호스트에서 도는 도우미(ops/focus.mjs)를 화면이 직접 부른다.
const GO = 'http://127.0.0.1:8732/go';
// 누르고 나온 말은 붙들어 둔다. 안 그러면 2초 뒤 갱신이 덮어써서 못 읽는다 —
// 도우미가 죽은 걸 이것 때문에 못 봤다.
let held = 0;
function say(t) { $('tally').textContent = t; held = Date.now() + 6000; }

// 한 수. 도구면 도구 이름을, 글이면 "답" 이라고 적는다.
function step(s, now, last) {
  const at = Date.parse(s.at);
  const when = Number.isFinite(at) ? ago(now - at) : '';
  const what = s.kind === 'tool'
    ? esc(s.tool.replace(/^mcp__[a-z-]+__/, ''))
    : '답';
  return `<div class="fw ${last ? 'now' : ''}">${esc(when)}</div>`
    + `<div class="ft ${s.kind === 'tool' ? '' : 'talk'}">${what}</div>`
    + `<div class="fx">${esc(cut(s.text || '', 90))}</div>`;
}

// 판이 붙이는 이름. '도는 중' 은 점이 대신하므로 여기 없다.
const PHASE = { waiting: '답 기다림', busy: '응답 없음', stopped: '멈춤' };

function winCard(x, now) {
  // 어느 카드든 누를 수 있다. 도우미가 먼저 창을 찾아 앞으로 가져오고,
  // 못 찾으면 — 창이 꺼진 것이다 — 그 자리에서 되살린다.
  const live = x.titled && x.name;   // 이름이 있어야 창을 제목으로 찾는다
  const steps = x.steps ?? [];
  return `<div class="win ${x.moving ? 'live' : ''} ${x.id === OPEN_ID ? 'sel' : ''}"`
    + ` data-id="${esc(x.id)}" data-title="${esc(x.name || x.id.slice(0, 8))}" title="누르면 대화를 봅니다"`
    + `><div class="wt"><span class="wn">${esc(x.name || x.id.slice(0, 8))}</span>`
    + (x.where ? `<span class="where">${esc(x.where)}</span>` : '')
    + `<span class="ws ${x.moving ? 'on' : esc(x.phase ?? '')}">`
    + (x.moving
        ? '<span class="dot"></span> 도는 중'
        : `${PHASE[x.phase] ?? ''} ${ago(x.idleMs)}`.trim()) + '</span></div>'
    + (x.asked
        ? `<div class="say"><i>방금</i>${esc(cut(x.asked, 70))}</div>`
        : '<div class="say empty">시킨 말 없음</div>')
    + (steps.length
        ? `<div class="flow">${steps.map((s, i) => step(s, now, i === steps.length - 1)).join('')}</div>`
        : '')
    + `<div class="foot"><span>${esc(x.branch ?? '')}</span>`
    + (x.cost ? `<span>${toks(x.cost)}</span><span class="usd">${money(x.cost.usd)}</span>` : '')
    + `<button class="go pick" data-id="${esc(x.id)}" data-name="${esc(live ? x.name : '')}"`
    + ` title="${live ? '그 창을 앞으로' : '꺼진 창 — 되살립니다'}">${live ? '창 열기' : '되살리기'}</button>`
    + '</div></div>';
}

// ── 열린 창 ──────────────────────────────────────────────────
// 여기는 기록이 아니라 등록부다. 창이 닫히면 클로드가 그 파일을 지우므로 남은 것이
// 곧 열린 창이고, 이 저장소 밖의 창도 같이 보인다.
const STALE_MS = 10 * 60 * 1000;   // 이만큼 기척이 없으면 유령일 수 있다

const since = ms => { const t = ago(ms); return t === '방금' ? '방금 열림' : t.replace(' 전', '째'); };

function liveRow(w, now) {
  const stale = now - w.updatedAt > STALE_MS;
  const up = w.startedAt ? since(now - w.startedAt) : '';
  return `<div class="lv ${stale ? 'old' : ''} ${w.name ? 'pick' : ''}"`
    + ` data-id="${esc(w.id)}" data-name="${esc(w.name ?? '')}"`
    + ` title="${w.name ? '누르면 그 창이 앞으로' : '이름이 없어 창을 못 찾습니다 — /name 으로 붙이세요'}">`
    + `<span class="st ${esc(w.status ?? '')}"></span>`
    + `<span class="ln ${w.named ? '' : 'noname'}">${esc(w.name ?? w.id.slice(0, 8))}`
    + (w.here ? '<span class="me">여기</span>' : '') + '</span>'
    + `<span class="lp">${esc(w.project ?? '')}</span>`
    + `<span class="lm">pid ${esc(w.pid ?? '?')}${up ? ' · ' + esc(up) : ''}`
    + (stale ? ' · 기척 없음' : '') + '</span></div>';
}

// ── 장부 ─────────────────────────────────────────────────────
// 장부 줄에는 어느 창이 올렸는지가 없다. 만드는 쪽·재는 쪽만 적힌다 —
// 그래서 창 카드에 붙이지 않고 탭을 따로 뺐다. 없는 짝을 지어내면 안 된다.
const TAG = { 확인: ['ok', '확인'], 반박: ['no', '반박'], 보류: ['hold', '보류'] };

function ledgerRow(r, now) {
  const [cls, label] = r.kind === 'claim' ? ['claim', '주장']
    : r.kind === 'verdict' ? (TAG[r.v] ?? ['hold', r.v ?? '판정'])
    : ['note', '메모'];
  const what = r.what ?? r.note ?? r.text ?? '';
  const who = r.by === 'builder' ? '만드는 쪽' : r.by === 'verifier' ? '재는 쪽' : (r.by ?? '');
  const at = Date.parse(r.at);
  return `<div class="row"><span class="rid">${esc(r.id ?? '')}</span>`
    + `<span class="tag ${cls}">${esc(label)}</span>`
    + `<span class="what">${esc(what)}</span>`
    + `<span class="when">${esc(who)} · ${Number.isFinite(at) ? ago(now - at) : ''}</span></div>`;
}

// 펴 놓은 판. 화면은 2초마다 통째로 다시 그리는데, 그때 <details> 의 열린 상태가
// 같이 날아가 사람이 읽던 글이 저절로 접혔다. 어느 판을 폈는지는 화면 밖에 둔다.
const OPENED = new Set();
// toggle 은 위로 안 올라온다. 잡는 단계에서 받아야 한다.
addEventListener('toggle', e => {
  const d = e.target.closest?.('.lap, .msg');
  if (!d) return;
  const k = d.dataset.lap;
  if (d.open) OPENED.add(k); else OPENED.delete(k);
}, true);

// 자동 한 판. 접힌 줄에는 그 판이 정한 "다음 계획" 만 보인다 — 그게 다음 판의
// 물음이 되니, 줄만 훑어도 일이 어디로 가는지 읽힌다. 펴면 물음과 답 전문.
function lapRow(r, now) {
  const at = Date.parse(r.at);
  const use = [Number.isFinite(at) ? ago(now - at) : '',
               r.ms ? Math.round(r.ms / 1000) + '초' : '',
               r.turns ? r.turns + '턴' : '',
               r.cost != null ? money(r.cost) : ''].filter(Boolean).join(' · ');
  const plan = r.plan || (r.stuck ? '막혔습니다 — 사람 차례' : cut(r.say || '(빈 답)', 80));
  // 열쇠는 판 번호가 아니라 시각이다. 고리를 다시 켤 때마다 번호가 1 부터 새로
  // 시작해서, 번호로 잡으면 "1판" 을 누를 때 옛 1판까지 같이 열렸다.
  const key = String(r.at ?? r.round ?? '');
  return `<details class="lap ${r.stuck ? 'stuck' : ''}" data-lap="${esc(key)}"`
    + `${OPENED.has(key) ? ' open' : ''}>`
    + `<summary><span class="no">${esc(String(r.round ?? ''))}판</span>`
    + `<span class="plan ${r.plan ? '' : 'none'}">${esc(cut(plan, 90))}</span>`
    + `<span class="use">${esc(use)}</span></summary>`
    + `<div class="body">`
    + `<div><h4>물음 (앞판의 답)</h4>${mdBox(r.ask || '', 'a' + key)}</div>`
    + `<div><h4>답</h4>${mdBox(r.say || r.err || '(없음)', 's' + key)}</div>`
    + `</div></details>`;
}

// 창끼리 주고받은 지시 한 줄. 본채가 하위 창에 일을 넘기면 여기 쌓인다.
// 접힌 줄에는 누가 누구에게와 첫 줄, 펴면 전문.
function talkRow(m, now) {
  const at = Date.parse(m.at);
  const first = (m.message.split('\n').find(l => l.trim()) || '').trim();
  const key = 'm' + (m.at ?? '') + m.from;
  return `<details class="lap msg" data-lap="${esc(key)}"${OPENED.has(key) ? ' open' : ''}>`
    + `<summary><span class="no">${esc(m.from)} → ${esc(m.to)}</span>`
    + `<span class="plan">${esc(cut(m.summary || first || '(빈 지시)', 90))}</span>`
    + `<span class="use">${Number.isFinite(at) ? ago(now - at) : ''}${m.idle ? ' · 끝나면 알림' : ''}</span></summary>`
    + `<div class="body"><div>${mdBox(m.message || '(끝나면 알려 달라는 신청만)', key)}</div></div></details>`;
}

function draw(d) {
  const now = Date.now();
  const { sessions, live, spend, repo, open, recent, counts, handoff, loop, talk } = d;

  const talkHtml = (talk ?? []).length
    ? talk.map(m => talkRow(m, now)).join('')
    : '<div class="none" style="padding:10px 12px">아직 창끼리 주고받은 지시가 없습니다</div>';
  if ($('talk').innerHTML !== talkHtml) $('talk').innerHTML = talkHtml;
  $('n-talk').textContent = (talk ?? []).length || '';

  // 하루 넘게 멈춘 창은 아래 "지난 창" 으로 접는다. 지금 도는 창이 묻히지 않게.
  const fresh = sessions.filter(x => x.idleMs < OLD_MS);
  const olds = sessions.filter(x => x.idleMs >= OLD_MS);
  // main 이 있으면 나무로 그린다: main 한 장, 줄기, 서브들. 나머지는 "따로 도는 창".
  const T = d.team ?? { main: null, subs: [] };
  const main = sessions.find(x => x.id === T.main);
  const subIds = new Set(T.subs.map(s => s.id));
  const laps0 = loop ?? [];
  const lastLap = laps0[0];
  const loopOn = lastLap && now - Date.parse(lastLap.at) < LOOP_ON_MS;
  if (main) {
    const subCards = T.subs.map(s => {
      const x = sessions.find(y => y.id === s.id);
      if (!x) return '';
      const o = s.order;
      return `<div class="sub">${o ? `<div class="order">← <b>지시</b> ${esc(cut(o.text, 60))} · ${ago(now - Date.parse(o.at))}</div>` : ''}`
        + winCard(x, now) + '</div>';
    }).join('')
      + (lastLap ? `<div class="sub"><div class="order">← <b>자동</b> 답이 다음 물음이 된다</div>`
        + `<div class="win loopcard ${loopOn ? 'live' : ''}" data-pane="pane-loop" title="누르면 자동 탭">`
        + `<div class="wt"><span class="wn">자동 작업</span>`
        + `<span class="ws ${loopOn ? 'on' : 'stopped'}">${loopOn ? '<span class="dot"></span> ' + esc(lastLap.round) + '판째' : '멈춤 ' + ago(now - Date.parse(lastLap.at))}</span></div>`
        + `<div class="say"><i>다음</i>${esc(cut(lastLap.plan || lastLap.say || '', 80))}</div></div></div>` : '');
    $('team').innerHTML = `<div class="win brain ${main.moving ? 'live' : ''} ${main.id === OPEN_ID ? 'sel' : ''}" `
      + winCard(main, now).replace(/^<div class="win[^"]*"/, '').replace('<span class="wn">', '<span class="role">뇌</span><span class="wn">')
      + '<div class="trunk"></div>'
      + `<div class="subs">${subCards || '<div class="none">아직 서브가 없습니다 — 창을 띄우고 /rename 으로 이름을 붙이세요</div>'}</div>`;
  } else $('team').innerHTML = '';
  const apart = fresh.filter(x => x.id !== T.main && !subIds.has(x.id));
  $('wins').innerHTML = (main && apart.length ? '<div class="apart" style="grid-column:1/-1">따로 도는 창</div>' : '')
    + (apart.length ? apart.map(x => winCard(x, now)).join('')
      : main ? '' : '<div class="none">하루 안에 움직인 창이 없습니다</div>');
  $('oldbox').hidden = !olds.length;
  $('n-old').textContent = olds.length || '';
  $('olds').innerHTML = olds.map(x => winCard(x, now)).join('');
  const me = sessions.find(x => x.id === OPEN_ID);
  if (me) $('dphase').innerHTML = phaseText(me);

  $('ledger').innerHTML = recent.length
    ? recent.map(r => ledgerRow(r, now)).join('')
    : '<div class="none" style="padding:10px 12px">장부가 비어 있습니다</div>';

  $('live').innerHTML = (live ?? []).length
    ? live.map(w => liveRow(w, now)).join('')
    : '<div class="none" style="padding:10px 12px">열린 창이 없습니다</div>';

  const laps = loop ?? [];
  // 다시 켜면 판 번호가 1 부터 새로 시작해서 목록이 2 1 7 6 … 으로 보인다.
  // 번호가 도로 올라가는 자리가 다시 켠 자리다. 거기에 금을 긋는다.
  const lapHtml = laps.length
    ? laps.map((r, i) => lapRow(r, now)
        + (laps[i + 1] && r.round < laps[i + 1].round ? '<div class="again">다시 켠 자리</div>' : '')).join('')
    : '<div class="none" style="padding:10px 12px">아직 한 판도 안 돌았습니다</div>';
  // 바뀐 게 없으면 손대지 않는다. 2초마다 다시 그리면 펴 놓은 글의 스크롤과
  // 끌어 놓은 선택이 그때마다 사라진다 — 긴 답을 읽을 수가 없었다.
  if ($('loop').innerHTML !== lapHtml) $('loop').innerHTML = lapHtml;

  $('n-wins').textContent = fresh.length || '';
  $('n-live').textContent = (live ?? []).length || '';
  $('n-ledger').textContent = recent.length || '';
  $('n-loop').textContent = laps.length || '';

  const stuck = open.filter(x => x.stuck).length;
  const pending = handoff?.pending ? 1 : 0;
  // 방금 누르고 나온 말은 덮지 않는다. 나머지 칸은 그대로 갱신한다.
  if (Date.now() >= held) {
    $('tally').innerHTML = `열림 <b>${open.length}</b> · 닫힘 <b>${counts.closed}</b>`
      + (stuck ? ` · <span class="hot">사람 차례 ${stuck}</span>` : '')
      + (pending ? ' · <span class="cool">넘길 것 1</span>' : '')
      + (spend ? ` · <b>${money(spend)}</b>` : '');
  }

  $('repo').textContent = repo
    ? `${repo.branch}${repo.dirty.length ? ' · 안 올린 파일 ' + repo.dirty.length : ' · 깨끗함'}`
    : '';

  // 넘길 게 남았으면 그것부터 말한다. Stop 훅이 막는 것과 같은 값이다.
  const h = handoff?.row;   // state() 는 row 로 준다 — CLI 만 last 로 바꿔 찍는다
  $('handoff').innerHTML = pending && h
    ? `<div class="warn-strip">넘길 게 남았습니다 — <b>${esc(h.id)}</b> `
      + `${h.kind === 'claim' ? '주장' : '판정'}을 ${h.by === 'builder' ? '재는' : '만드는'} 쪽에 알리세요.</div>`
    : '';
}

const SAID = { opened: '꺼진 창을 새로 띄웠습니다', badid: '세션 아이디가 이상합니다',
               notfound: '창도 못 찾고 되살리지도 못했습니다' };

async function go(e) {
  const g = e.target.closest('.pick');
  if (!g) return;
  const q = new URLSearchParams({ name: g.dataset.name || '', id: g.dataset.id || '' });
  try {
    const r = await fetch(GO + '?' + q);
    const { result } = await r.json();
    if (result !== 'ok') say(SAID[result] ?? ('안 됐습니다 — ' + result));
  } catch {
    say('창 도우미가 없습니다 — node ops/focus.mjs');
  }
}
// ── 대화 서랍 ────────────────────────────────────────────────
// 카드를 누르면 그 세션에서 사람과 주고받은 말이 뜬다. 기록 끝 토막부터 읽고,
// 위 "더 보기" 로 앞 토막을 더 부른다. 도는 세션이면 2초마다 새 말이 아래에 붙는다.
const OLD_MS = 24 * 60 * 60 * 1000;
// 자동 작업은 판 사이 15분을 쉬고 한 판이 15~20분 돈다. 이 안에 판이 끝났으면 도는 중.
const LOOP_ON_MS = 45 * 60 * 1000;
let OPEN_ID = null, CHAT = [], HEAD = 0, TAIL = 0, pulling = false;
const TOOLS_OPEN = new Set();
addEventListener('toggle', e => {
  const d = e.target.closest?.('.tools');
  if (!d) return;
  if (d.open) TOOLS_OPEN.add(d.dataset.k); else TOOLS_OPEN.delete(d.dataset.k);
}, true);

const phaseText = x => x.moving ? '<span class="dot"></span> 도는 중'
  : esc(`${PHASE[x.phase] ?? ''} ${ago(x.idleMs)}`.trim());
const hhmm = t => { const d = new Date(t); return isNaN(d) ? '' : d.toTimeString().slice(0, 5); };
const dayOf = t => { const d = new Date(t); return isNaN(d) ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일`; };

function bubble(it, i) {
  if (it.who === 'tools') {
    const k = (it.at ?? '') + ':' + it.tools[0].name + it.tools[0].text;
    return `<details class="tools" data-k="${esc(k)}"${TOOLS_OPEN.has(k) ? ' open' : ''}>`
      + `<summary>도구 ${it.tools.length}번 · ${esc([...new Set(it.tools.map(t => t.name.replace(/^mcp__[a-z-]+__/, '')))].slice(0, 4).join(', '))}</summary>`
      + `<ol>${it.tools.map(t => `<li><b>${esc(t.name.replace(/^mcp__[a-z-]+__/, ''))}</b>${esc(t.text)}</li>`).join('')}</ol></details>`;
  }
  const who = it.who === 'me' ? '나' : it.who === 'in' ? `${it.from} 이 보낸 지시` : 'Claude';
  return `<div class="bub ${it.who}"><span class="t">${esc(who)} · ${hhmm(it.at)}</span>${mdBox(it.text, 'b' + it.at + it.who + it.text.length)}</div>`;
}

function drawChat(stick) {
  const body = $('dbody');
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  let html = HEAD > 0 ? '<button class="more" id="dmore">더 보기</button>' : '';
  let day = '';
  CHAT.forEach((it, i) => {
    const d = dayOf(it.at);
    if (d && d !== day) { html += `<div class="day">${d}</div>`; day = d; }
    html += bubble(it, i);
  });
  if (!CHAT.length) html += '<div class="none">이 토막에는 주고받은 말이 없습니다</div>';
  const prevH = body.scrollHeight, prevTop = body.scrollTop;
  body.innerHTML = html;
  // 새 말이 붙을 때 아래에서 읽고 있었으면 따라 내려간다. 위를 읽는 중이면 그대로.
  if (stick === 'bottom' || (stick === 'follow' && atBottom)) body.scrollTop = body.scrollHeight;
  else if (stick === 'keep') body.scrollTop = prevTop + (body.scrollHeight - prevH);
  else body.scrollTop = prevTop;
}

// 앞 토막을 붙일 때 경계에서 도구 묶음이 둘로 갈릴 수 있다. 이어 붙인다.
function joinChat(a, b) {
  if (a.length && b.length && a.at(-1).who === 'tools' && b[0].who === 'tools') {
    return [...a.slice(0, -1), { ...a.at(-1), tools: [...a.at(-1).tools, ...b[0].tools] }, ...b.slice(1)];
  }
  return [...a, ...b];
}

async function openChat(id, title) {
  OPEN_ID = id; CHAT = []; HEAD = TAIL = 0;
  $('dname').textContent = title;
  $('dphase').innerHTML = '';
  $('dbody').innerHTML = '<div class="none">불러오는 중…</div>';
  $('drawer').hidden = false;
  for (const w of document.querySelectorAll('.win')) w.classList.toggle('sel', w.dataset.id === id);
  try {
    const r = await (await fetch('/api/log?id=' + encodeURIComponent(id))).json();
    if (OPEN_ID !== id) return;
    CHAT = r.items; HEAD = r.start; TAIL = r.end;
    drawChat('bottom');
  } catch { $('dbody').innerHTML = '<div class="none">기록을 못 읽었습니다</div>'; }
}

async function moreChat() {
  const id = OPEN_ID;
  const r = await (await fetch(`/api/log?id=${encodeURIComponent(id)}&before=${HEAD}`)).json();
  if (OPEN_ID !== id) return;
  CHAT = joinChat(r.items, CHAT); HEAD = r.start;
  drawChat('keep');
}

async function pullChat() {
  if (!OPEN_ID || pulling || !TAIL) return;
  pulling = true;
  const id = OPEN_ID;
  try {
    const r = await (await fetch(`/api/log?id=${encodeURIComponent(id)}&from=${TAIL}`)).json();
    if (OPEN_ID !== id || r.end === TAIL) return;
    TAIL = r.end;
    if (r.items.length) { CHAT = joinChat(CHAT, r.items); drawChat('follow'); }
  } catch { /* 다음 갱신에 다시 */ } finally { pulling = false; }
}

function closeChat() {
  OPEN_ID = null;
  $('drawer').hidden = true;
  for (const w of document.querySelectorAll('.win.sel')) w.classList.remove('sel');
}

function onCard(e) {
  if (e.target.closest('.go')) return go(e);
  const w = e.target.closest('.win');
  if (w) openChat(w.dataset.id, w.dataset.title);
}
$('wins').addEventListener('click', onCard);
$('team').addEventListener('click', e => {
  const l = e.target.closest('.loopcard');
  if (l) return pick(l.dataset.pane);
  onCard(e);
});
$('olds').addEventListener('click', onCard);
$('dclose').addEventListener('click', closeChat);
$('dbody').addEventListener('click', e => { if (e.target.id === 'dmore') moreChat(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN_ID) closeChat(); });
$('live').addEventListener('click', go);

let stale = 0;
async function tick() {
  try {
    draw(await (await fetch('/api/board')).json());
    stale = 0;
    pullChat();
  } catch {
    // 서버가 잠깐 없어도 화면은 남긴다. 계속 못 받으면 그때 말한다.
    if (++stale > 3) $('tally').textContent = '서버가 안 보입니다';
  }
}
tick();
setInterval(tick, 2000);
</script>
