# 주소를 사람이 읽을 수 있게 만든다.
#
# 기본 배포에는 안 낀다. 도메인과 열린 80·443 이 있어야 인증서를 받으므로,
# 준비된 다음에 겹쳐서 올린다.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.tls.yml up -d
#
# SITE_HOST 는 deploy/.env 에 적는다. 자세한 건 DOCKER.md 를 보세요.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # 인증서 받을 때 쓴다. 닫으면 발급이 안 된다.
      - "443:443"
    env_file: [.env]
    environment:
      SITE_HOST: ${SITE_HOST:?deploy/.env 에 SITE_HOST 를 적으세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # 받은 인증서. 지우면 매번 새로 받는다.
      - caddy-config:/config
    depends_on: [stock]

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
